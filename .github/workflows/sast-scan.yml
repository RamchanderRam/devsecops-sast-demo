name: DevSecOps SAST Pipeline
on:
  push:
    branches:
      - main
jobs:
  sonarcloud-scan:
    name: Run SonarCloud Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Deep fetch for accurate analysis

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Built-in GitHub token
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # The secret you just added
